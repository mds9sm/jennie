<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Magic lamp base -->
  <ellipse cx="32" cy="54" rx="16" ry="4" fill="#7C3AED" opacity="0.15"/>
  <path d="M22 48 C22 48 20 52 22 54 C24 56 40 56 42 54 C44 52 42 48 42 48Z" fill="#7C3AED" opacity="0.3"/>
  <path d="M24 44 C24 44 22 48 24 50 C26 52 38 52 40 50 C42 48 40 44 40 44Z" fill="#7C3AED" opacity="0.5"/>
  <!-- Lamp body -->
  <path d="M26 44 L28 38 L36 38 L38 44Z" fill="#7C3AED"/>
  <ellipse cx="32" cy="38" rx="5" ry="2" fill="#8B5CF6"/>
  <!-- Lamp spout -->
  <path d="M36 38 Q38 36 42 35" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Genie smoke/swirl emerging -->
  <path d="M32 34 C30 28 26 26 28 20 C30 14 36 16 34 22 C32 28 38 24 36 18 C34 12 28 10 32 6"
        stroke="#8B5CF6" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Cutie face (round, cute, emerging from smoke) -->
  <circle cx="32" cy="14" r="10" fill="#8B5CF6"/>
  <circle cx="32" cy="14" r="9" fill="#A78BFA"/>
  <!-- Eyes (big, cute) -->
  <circle cx="28.5" cy="13" r="2.5" fill="white"/>
  <circle cx="35.5" cy="13" r="2.5" fill="white"/>
  <circle cx="29" cy="12.5" r="1.2" fill="#1E1B4B"/>
  <circle cx="36" cy="12.5" r="1.2" fill="#1E1B4B"/>
  <!-- Eye sparkle -->
  <circle cx="29.5" cy="12" r="0.5" fill="white"/>
  <circle cx="36.5" cy="12" r="0.5" fill="white"/>
  <!-- Cute smile -->
  <path d="M29 17 Q32 20 35 17" stroke="#1E1B4B" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="26" cy="16" r="1.5" fill="#C084FC" opacity="0.5"/>
  <circle cx="38" cy="16" r="1.5" fill="#C084FC" opacity="0.5"/>

  <!-- Data sparkles around head -->
  <g fill="#7C3AED" opacity="0.7">
    <circle cx="18" cy="10" r="1"/>
    <circle cx="46" cy="8" r="1.2"/>
    <circle cx="20" cy="4" r="0.8"/>
    <circle cx="44" cy="16" r="0.8"/>
    <circle cx="16" cy="18" r="1"/>
  </g>
  <!-- Tiny data symbols -->
  <text x="14" y="8" font-size="5" fill="#7C3AED" opacity="0.5" font-family="monospace">0</text>
  <text x="46" y="14" font-size="5" fill="#7C3AED" opacity="0.5" font-family="monospace">1</text>
  <text x="48" y="4" font-size="4" fill="#7C3AED" opacity="0.4" font-family="monospace">{}</text>
</svg>
